<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>多港口出口方案 — ETC Sourcing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-blue': '#0F4C81',
            'vibrant-orange': '#F97316',
            'light-gray': '#F8FAFC',
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    * { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    
    /* Card hover effect */
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25);
    }
    
    /* Port card highlighted */
    .port-highlight {
      background: linear-gradient(135deg, #0F4C81 0%, #1a5a9e 100%);
    }
    
    /* Table styling */
    .route-table th {
      background: #0F4C81;
      color: white;
    }
    .route-table tr:nth-child(even) {
      background: #F8FAFC;
    }
    
    /* Language switch */
    .lang-btn {
      transition: all 0.2s ease;
    }
    .lang-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    
    /* Pulse animation for featured port */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
      50% { box-shadow: 0 0 20px 10px rgba(249, 115, 22, 0.2); }
    }
    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
  </style>
<base target="_blank">
</head>
