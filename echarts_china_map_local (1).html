<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETC Sourcing - Supply Chain Network</title>
<!-- 本地 ECharts 库 -->
<script src="./echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0f172a;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
}
#map-container {
    width: 100vw;
    height: 100vh;
    position: relative;
}
#map {
    width: 100%;
    height: 100%;
}
.header {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
}
.header h1 {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 5px;
    color: #e2e8f0;
    margin-bottom: 6px;
}
.header .subtitle {
    font-size: 13px;
    color: #64748b;
    letter-spacing: 2px;
}
.header .subtitle span { color: #f97316; font-weight: 500; }
</style>
</head>
<body>

<div id="map-container">
    <div class="header">
        <h1>SUPPLY CHAIN NETWORK</h1>
        <div class="subtitle">From Industry Belts to Ports, <span>Matching Optimal Supply Solutions</span></div>
    </div>
    <div id="map"></div>
</div>

<script>
// 本地中国地图数据文件
const CHINA_MAP_URL = './china.json';

const industryCenters = [
    { name: 'Bohai Rim', coord: [118.5, 39.5], color: '#f97316' },
    { name: 'Yangtze Delta', coord: [121.0, 31.5], color: '#eab308' },
    { name: 'Pearl River Delta', coord: [113.5, 23.0], color: '#22c55e' },
    { name: 'Central & Western', coord: [107.0, 30.0], color: '#38bdf8' }
];

const industryInfo = {
    'Bohai Rim': {
        title: 'Bohai Rim Industrial Belt',
        desc: 'Covering Beijing-Tianjin-Hebei, Shandong Peninsula, and Liaodong Peninsula. Strong in heavy industries including equipment manufacturing, chemicals, steel, and auto parts. Supported by Qingdao, Tianjin, and Dalian ports.',
        tags: ['Equipment Mfg.', 'Chemicals', 'Steel', 'Auto Parts']
    },
    'Yangtze Delta': {
        title: 'Yangtze River Delta + Zhejiang',
        desc: 'Centered on Shanghai, Hangzhou, Ningbo, and Suzhou. Dense clusters of machinery, hardware, daily goods, small commodities, textiles, and electronic components. Ningbo and Shanghai are the world's busiest ports.',
        tags: ['Machinery', 'Daily Goods', 'Small Commodities', 'Textiles']
    },
    'Pearl River Delta': {
        title: 'Pearl River Delta Industrial Belt',
        desc: 'Centered on Guangzhou, Shenzhen, Dongguan, and Foshan. Leading in electronics, consumer electronics, communication equipment, home appliances, and LED. Shenzhen and Guangzhou are the main southern export hubs.',
        tags: ['Electronics', 'Consumer Elec.', 'Comm. Equipment', 'Home Appliances']
    },
    'Central & Western': {
        title: 'Central & Western China Belt',
        desc: 'Centered on Chongqing, Chengdu, Wuhan, and Xi'an. Fast-growing industries include automotive electronics, equipment manufacturing, optoelectronics, and new materials. Cost advantages with Yangtze River shipping and China-Europe Railway links.',
        tags: ['Auto Electronics', 'Equipment Mfg.', 'Optoelectronics', 'New Materials']
    }
};

const ports = [
    { name: 'Dalian Port', coord: [121.6, 38.9], color: '#f97316', labelPos: 'right' },
    { name: 'Tianjin Port', coord: [117.8, 39.0], color: '#f97316', labelPos: 'left' },
    { name: 'Qingdao Port', coord: [120.4, 36.1], color: '#f97316', labelPos: 'right' },
    { name: 'Shanghai Port', coord: [121.5, 31.2], color: '#eab308', labelPos: 'right' },
    { name: 'Ningbo Port', coord: [121.8, 29.9], color: '#eab308', labelPos: 'right' },
    { name: 'Xiamen Port', coord: [118.1, 24.5], color: '#22c55e', labelPos: 'right' },
    { name: 'Shenzhen Port', coord: [114.1, 22.5], color: '#22c55e', labelPos: 'right' }
];

const portInfo = {
    'Dalian Port': {
        title: 'Dalian Port',
        desc: 'A major international shipping hub in Northeast Asia. Deep-water port and the largest comprehensive port in Northeast China, connecting Japan, Korea, and Russia Far East routes.',
        tags: ['NE Asia Hub', 'Deep-Water', 'Japan/Korea Routes']
    },
    'Tianjin Port': {
        title: 'Tianjin Port',
        desc: 'The maritime gateway to Beijing-Tianjin-Hebei. The largest comprehensive port in Northern China with top global container throughput. The most important export channel for North China.',
        tags: ['Beijing-Tianjin Gateway', 'Comprehensive Port', 'North China Hub']
    },
    'Qingdao Port': {
        title: 'Qingdao Port',
        desc: 'The largest container port in Northern China. World-leading automated terminal connecting Japan, Korea, Southeast Asia, Europe, and Americas.',
        tags: ['North China Largest Container', 'Automated Terminal', 'Global Routes']
    },
    'Shanghai Port': {
        title: 'Shanghai Port',
        desc: 'World's #1 container port by throughput. Located at the Yangtze River mouth, an international shipping center connecting 200+ countries and regions.',
        tags: ['Container #1 Global', 'Int'l Shipping Center', 'Yangtze Gateway']
    },
    'Ningbo Port': {
        title: 'Ningbo Port',
        desc: 'World's #1 cargo port by throughput. Deep-water port with top-3 global container volume. The core foreign trade hub of the Yangtze Delta.',
        tags: ['Cargo #1 Global', 'Deep-Water', 'Trade Core Hub']
    },
    'Xiamen Port': {
        title: 'Xiamen Port',
        desc: 'A major container port on the Southeast coast. Key channel for Taiwan trade, connecting Southeast Asia and Japan/Korea routes. Main export gateway for the West Coast Economic Zone.',
        tags: ['Taiwan Trade', 'Southeast Coast', 'West Coast Zone']
    },
    'Shenzhen Port': {
        title: 'Shenzhen Port',
        desc: 'The largest container port in South China. Adjacent to Hong Kong, the main export channel for electronics and high-tech products, connecting major global routes.',
        tags: ['South China Largest Container', 'Electronics Export', 'Shenzhen-HK Link']
    }
};

function generateCirclePoints(center, radiusKm, numPoints) {
    const points = [];
    const R = 6371;
    const lat0 = center[1] * Math.PI / 180;
    const lng0 = center[0] * Math.PI / 180;

    for (let i = 0; i <= numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const lat = Math.asin(Math.sin(lat0) * Math.cos(radiusKm / R) + 
                               Math.cos(lat0) * Math.sin(radiusKm / R) * Math.cos(angle));
        const lng = lng0 + Math.atan2(Math.sin(angle) * Math.sin(radiusKm / R) * Math.cos(lat0),
                                      Math.cos(radiusKm / R) - Math.sin(lat0) * Math.sin(lat));
        points.push([lng * 180 / Math.PI, lat * 180 / Math.PI]);
    }
    return points;
}

const chart = echarts.init(document.getElementById('map'));

fetch(CHINA_MAP_URL)
    .then(res => res.json())
    .then(geoJson => {
        echarts.registerMap('china', geoJson);

        const series = [];

        // 1. Industry belt outer circle
        industryCenters.forEach(center => {
            const circlePoints = generateCirclePoints(center.coord, 320, 100);
            series.push({
                type: 'scatter',
                coordinateSystem: 'geo',
                data: circlePoints.map(p => ({
                    value: p,
                    itemStyle: { color: center.color, opacity: 0.35 }
                })),
                symbolSize: 4,
                silent: true,
                z: 2
            });
        });

        // 2. Industry belt inner circle
        industryCenters.forEach(center => {
            const circlePoints = generateCirclePoints(center.coord, 260, 80);
            series.push({
                type: 'scatter',
                coordinateSystem: 'geo',
                data: circlePoints.map(p => ({
                    value: p,
                    itemStyle: { color: center.color, opacity: 0.25 }
                })),
                symbolSize: 3,
                silent: true,
                z: 2
            });
        });

        // 3. Industry belt center labels
        series.push({
            type: 'scatter',
            coordinateSystem: 'geo',
            data: industryCenters.map(c => ({
                name: c.name,
                value: c.coord,
                itemStyle: { color: c.color },
                label: {
                    show: true,
                    position: 'top',
                    distance: 15,
                    fontSize: 16,
                    fontWeight: 'bold',
                    color: c.color,
                    formatter: '{b}'
                }
            })),
            symbolSize: 8,
            z: 5
        });

        // 4. Port nodes
        ports.forEach(p => {
            series.push({
                type: 'effectScatter',
                coordinateSystem: 'geo',
                data: [{
                    name: p.name,
                    value: p.coord,
                    itemStyle: { color: p.color }
                }],
                symbolSize: 14,
                showEffectOn: 'render',
                rippleEffect: {
                    brushType: 'stroke',
                    scale: 3.5,
                    period: 3
                },
                label: {
                    show: true,
                    position: p.labelPos,
                    distance: 10,
                    fontSize: 12,
                    fontWeight: 600,
                    color: p.color,
                    formatter: '{b}'
                },
                z: 4
            });
        });

        const option = {
            backgroundColor: 'transparent',

            geo: {
                map: 'china',
                roam: true,
                zoom: 1.15,
                center: [108, 35],
                label: { show: false },
                itemStyle: {
                    areaColor: 'rgba(30, 41, 59, 0.35)',
                    borderColor: 'rgba(56, 189, 248, 0.12)',
                    borderWidth: 1
                },
                emphasis: {
                    itemStyle: {
                        areaColor: 'rgba(51, 65, 85, 0.5)'
                    }
                }
            },

            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                borderColor: 'rgba(56, 189, 248, 0.2)',
                borderWidth: 1,
                textStyle: { color: '#e2e8f0', fontSize: 13 },
                padding: [14, 18],
                extraCssText: 'border-radius: 10px; max-width: 340px;',
                formatter: function(params) {
                    const name = params.name;

                    if (industryInfo[name]) {
                        const info = industryInfo[name];
                        let tagsHtml = info.tags.map(tag => 
                            `<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;margin:3px 3px 0 0;background:${params.color}22;color:${params.color}">${tag}</span>`
                        ).join('');

                        return `<div style="font-weight:700;font-size:15px;margin-bottom:8px;color:${params.color}">${info.title}</div>
                                <div style="color:#94a3b8;font-size:12px;line-height:1.7;margin-bottom:8px">${info.desc}</div>
                                <div>${tagsHtml}</div>`;
                    }

                    if (portInfo[name]) {
                        const info = portInfo[name];
                        let tagsHtml = info.tags.map(tag => 
                            `<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;margin:3px 3px 0 0;background:${params.color}22;color:${params.color}">${tag}</span>`
                        ).join('');

                        return `<div style="font-weight:700;font-size:15px;margin-bottom:8px;color:${params.color}">${info.title}</div>
                                <div style="color:#94a3b8;font-size:12px;line-height:1.7;margin-bottom:8px">${info.desc}</div>
                                <div>${tagsHtml}</div>`;
                    }

                    return params.name;
                }
            },

            series: series
        };

        chart.setOption(option);
    })
    .catch(err => {
        console.error('Map load failed:', err);
        document.getElementById('map').innerHTML = 
            '<div style="color:#64748b;text-align:center;padding-top:40vh;font-size:14px">Map loading failed.<br><br>Please make sure <b>echarts.min.js</b> and <b>china.json</b> are in the same folder.</div>';
    });

window.addEventListener('resize', () => chart.resize());
</script>

</body>
</html>
